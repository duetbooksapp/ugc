<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGC Brand Outreach Tracker</title>
<style>
  :root{
    --bg:#faf7f4; --panel:#fff; --line:#e8e0d8; --ink:#2c2621; --muted:#8a7f75;
    --accent:#c26a4a; --accent-soft:#f6e7e0;
    --ok:#3f8f6b; --ok-soft:#e3f2ea;
    --warn:#b8862b; --warn-soft:#fbf1dc;
    --dead:#9a9a9a; --dead-soft:#eeeeee;
    --info:#4a6fa5; --info-soft:#e6edf7;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1c1917; --panel:#252220; --line:#3a3532; --ink:#ece7e2; --muted:#9c938b;
      --accent:#e08a68; --accent-soft:#3a2c26;
      --ok:#6cc79b; --ok-soft:#24352d;
      --warn:#dcae5b; --warn-soft:#3a3222;
      --dead:#8a8580; --dead-soft:#302c2a;
      --info:#8ab0e0; --info-soft:#232d3a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
  .hide{display:none !important}

  header{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  header h1{font-size:24px;margin:0 0 2px;letter-spacing:-.02em}
  header p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .grow{flex:1}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.02em}
  .stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stat.hl b{color:var(--accent)}

  .controls,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
            padding:12px;margin-bottom:16px;box-shadow:var(--shadow)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row + .row{margin-top:10px}
  input,select,textarea{font:inherit;color:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input[type=search]{flex:1;min-width:180px}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);
        border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
       border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.9;color:#fff}
  .btn.ghost{background:transparent}
  .spacer{flex:1}
  h3{margin:0 0 4px;font-size:15px}
  .hint{font-size:12px;color:var(--muted);margin:0 0 10px}

  .count{font-size:12px;color:var(--muted);margin:0 0 8px 2px}

  /* Grid, not a list — at ~300 brands a single column is all scrolling. */
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
  #list .empty{grid-column:1/-1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .card.due{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
  .head{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;cursor:pointer;flex:1}
  .head:hover{background:var(--accent-soft)}
  .who{flex:1;min-width:0}
  .brand{font-weight:600;letter-spacing:-.01em;font-size:14.5px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .cardfoot{padding:0 12px 11px}
  .cardfoot select{width:100%}
  .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
       padding:2px 7px;border-radius:999px;background:var(--dead-soft);color:var(--muted)}
  .tag.generic{background:var(--info-soft);color:var(--info)}
  .tag.personal{background:var(--warn-soft);color:var(--warn)}
  .tag.dup{background:var(--accent-soft);color:var(--accent)}
  .tag.mine{background:var(--ok-soft);color:var(--ok)}
  .tag.duealert{background:var(--warn-soft);color:var(--warn);font-weight:600}
  select.status{font-size:13px;padding:6px 8px;border-radius:8px;font-weight:500}
  select.status[data-s="Pitched"],select.status[data-s="Followed Up"]{background:var(--info-soft);color:var(--info);border-color:var(--info)}
  select.status[data-s="Replied"],select.status[data-s="Negotiating"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  select.status[data-s="Collab!"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  select.status[data-s="Passed"],select.status[data-s="Bounced"]{background:var(--dead-soft);color:var(--dead)}

  .field{display:flex;flex-direction:column;gap:4px}
  .field.wide{flex:1;min-width:220px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  textarea{width:100%;min-height:70px;resize:vertical}
  a{color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
           justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 2px;font-size:19px}
  .modal .field{margin-bottom:10px}
  .modal input,.modal textarea,.modal select{width:100%}
  .qbar{font-size:12px;color:var(--muted);margin-bottom:10px}
  .qbrand{font-size:17px;font-weight:600;margin-bottom:2px}
  .ideawrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  @media(max-width:620px){ .ideawrap{grid-template-columns:1fr} }
  .suggestbox{background:var(--bg);border:1px dashed var(--line);border-radius:8px;
              padding:9px 11px;font-size:13.5px;white-space:pre-wrap;min-height:132px}

  /* ---- login ---- */
  #login{max-width:380px;margin:12vh auto;}
  #login .panel{padding:22px}
  #login h1{font-size:22px;margin:0 0 4px}
  #login input{width:100%;margin-bottom:10px}
  .err{color:var(--accent);font-size:13px;min-height:18px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
         background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
         font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  .toast.show{opacity:1}
  @media(max-width:560px){
    .head{flex-wrap:wrap}
    select.status{width:100%}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hide">
  <div class="panel">
    <h1>UGC Tracker</h1>
    <p class="hint">Sign in to load your brands and pitch history.</p>
    <input id="liEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="liPass" type="password" placeholder="Password" autocomplete="current-password">
    <p class="err" id="liErr"></p>
    <div class="row">
      <button class="btn primary" id="liGo">Sign in</button>
      <button class="btn ghost" id="liReset">Forgot password</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="wrap hide" id="app">

<header>
  <div class="grow">
    <h1>UGC Brand Outreach Tracker</h1>
    <p id="tagline">Loading…</p>
  </div>
  <button class="btn" id="btnSettings">⚙ Settings</button>
  <button class="btn" id="btnTemplates">✉ Templates</button>
  <button class="btn" id="btnAB">📊 A/B results</button>
  <button class="btn" id="btnAdd">+ Add brand</button>
  <button class="btn" id="btnFeedback">💬 Feedback</button>
  <button class="btn hide" id="btnOut">Sign out</button>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <div class="row">
    <input type="search" id="q" placeholder="Search brand, person, or email…">
    <select id="fStatus"><option value="">All statuses</option></select>
    <select id="fKind">
      <option value="">All contact types</option>
      <option value="named">Named person</option>
      <option value="generic">Generic inbox</option>
      <option value="personal">Personal (gmail etc.)</option>
    </select>
    <button class="chip" id="fNew">✨ Not pitched</button>
    <button class="chip" id="fDue">⏰ Follow-ups due</button>
    <button class="chip" id="fNoIdeas">💡 Needs ideas</button>
  </div>
  <div class="row" id="cats"></div>
  <div class="row" id="bulkBar">
    <button class="btn" id="bsPickAll">Select all shown</button>
    <button class="btn" id="bsPickNone">Clear</button>
    <button class="btn primary" id="btnBulk">✉ Send selected (0)</button>
    <span class="hint" id="bsCap" style="margin:0"></span>
  </div>
  <div class="row">
    <button class="btn primary" id="btnQueue">▶ Start send queue</button>
    <span class="spacer"></span>
    <button class="btn" id="expBackup">↓ Backup</button>
    <button class="btn" id="impBackup">↑ Restore</button>
    <button class="btn" id="expCsv">↓ CSV</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>

<p class="count" id="count"></p>
<div id="list"></div>

</div>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" hidden>
<div id="modalHost"></div>

<script type="module">
"use strict";

/* ============================================================
   CONFIG — paste your Firebase web config here to enable the
   hosted, logged-in, cross-device version. Left as-is, the app
   runs offline in this browser with no login.
   ============================================================ */
const FIREBASE_CONFIG = {
  "apiKey": "AIzaSyDqnzp4TQ4O37pV-1-icRvtNcvIeqP9RgI",
  "authDomain": "duet-ugc.firebaseapp.com",
  "databaseURL": "https://duet-ugc-default-rtdb.firebaseio.com",
  "projectId": "duet-ugc",
  "appId": "1:876863656225:web:7a048642a7111952222e60",
  "workerUrl": "https://ugc-ideas.smaxim.workers.dev"
};
const CLOUD = !FIREBASE_CONFIG.apiKey.startsWith("PASTE_");

/* Cloudflare Worker that reads a brand's site and drafts ideas. Left as-is,
   the Suggest button simply doesn't appear — everything else works. */
const WORKER_URL = "https://ugc-ideas.smaxim.workers.dev";
const CAN_SUGGEST = () => CLOUD && !WORKER_URL.startsWith("PASTE_") && !!getIdToken;
let getIdToken = null;   // set once she's signed in

/* Google OAuth client for sending Gmail. Each person supplies their OWN client
   id in Settings, created in their own Google Cloud project — so the consent
   screen carries their name, not whoever deployed this. The build-time constant
   below is only an optional default; normally it stays unset. */
const GOOGLE_CLIENT_ID = "PASTE_GOOGLE_CLIENT_ID";
const clientId = () =>
  (settings().googleClientId || "").trim() ||
  (GOOGLE_CLIENT_ID.startsWith("PASTE_") ? "" : GOOGLE_CLIENT_ID);
const CAN_SEND = () => /\.apps\.googleusercontent\.com$/.test(clientId());
const GMAIL_SCOPE = "https://www.googleapis.com/auth/gmail.send";

/* Embedded in the local build; empty in the deployed build, where
   the list is loaded from the database behind the login instead. */
let CONTACTS = [];

// Bump on every deploy. Shown under the title so you can tell at a glance which
// build is actually running — browsers cache this page aggressively.
const APP_VERSION = "1.15.1";

const CATEGORIES = ["Fashion & Apparel","Supplements & Wellness","Food & Beverage","Beauty & Skincare",
  "Home & Kitchen","Outdoor & Gear","Pickleball","Travel","Pet","DTC & Lifestyle","UK & Europe","Apps & Tech"];
const STATUSES = ["New","Pitched","Followed Up","Replied","Negotiating","Collab!","Passed","Bounced"];
const FOLLOWUP_DAYS = 7;
const LKEY = "ugcTracker.v2";
// No A/B verdict below this many sends — small samples read as signal when they aren't.
const AB_MIN_SENDS = 200;

const $  = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today = () => new Date().toISOString().slice(0,10);
const daysSince = d => d ? Math.floor((new Date(today()) - new Date(d)) / 86400000) : null;

/* ============================================================
   DEFAULTS
   ============================================================ */
const DEFAULT_ITEM = {status:"New", pitched:"", notes:""};

// dailyCap and sendGapSec exist to protect her Gmail account's standing, not
// to protect the app — cold sending in fast bursts is what gets accounts
// restricted. Deliberately low defaults; she can raise them knowingly.
const DEFAULT_SETTINGS = {name:"", email:"", signature:"", portfolio:"", ratecard:"",
                          dailyCap:15, sendGapSec:12, googleClientId:"",
                          // Creator profile — feeds the ✨ idea generator and the
                          // template drafter so both sound like her, not like AI.
                          about:"", favorites:"", audience:"",
                          voiceSample:"", styleNotes:"",
                          video1:"", video1Desc:"", video2:"", video2Desc:"",
                          // Socials + logistics — what creator-platform application
                          // forms ask for; not sent to the AI prompts.
                          igHandle:"", igFollowers:"", tiktokHandle:"", tiktokFollowers:"",
                          rateRange:"", location:""};

const DEFAULT_VARIANTS = [
  {
    id: "A",
    name: "A — direct",
    subjectPitch: "UGC content for {brand}",
    bodyNamed:
`Hi {name},

I'm {me} — I make user-generated content for brands, and I'd love to create some for {brand}.

{hook}

{ideas}

Happy to shoot any of those, or something else entirely if you've got a launch coming up. A few samples of my work: {portfolio}

Thanks for your time,
{me}
{signature}`,
    bodyGeneric:
`Hello,

I'm {me} — I make user-generated content for brands, and I'd love to create some for {brand}. If there's someone better placed on the creator partnerships side, I'd be grateful if you could pass this along.

{hook}

{ideas}

Happy to shoot any of those, or something else entirely if there's a launch coming up. A few samples of my work: {portfolio}

Thanks for your time,
{me}
{signature}`
  },
  {
    id: "B",
    name: "B — story-led",
    subjectPitch: "A content idea for {brand}",
    bodyNamed:
`Hi {name},

{hook}

That's the kind of thing I'd want to make for {brand}. I'm {me}, and I create user-generated content — the unpolished, believable kind that reads like a recommendation instead of an ad.

{ideas}

Here's some of my work: {portfolio}

If one of those is close, tell me which and I'll flesh it out properly.

Thanks,
{me}
{signature}`,
    bodyGeneric:
`Hello,

{hook}

That's the kind of thing I'd want to make for {brand}. I'm {me}, and I create user-generated content — the unpolished, believable kind that reads like a recommendation instead of an ad. If someone else there handles creator partnerships, I'd appreciate you passing this on.

{ideas}

Here's some of my work: {portfolio}

Thanks,
{me}
{signature}`
  }
];

const DEFAULT_TEMPLATES = {
  variants: DEFAULT_VARIANTS,
  subjectFollow: "Re: UGC content for {brand}",
  bodyFollow:
`Hi {name},

Just floating this back up in case it got buried — I know inboxes get busy.

I'm still keen to create some content for {brand}, and happy to shape it around whatever you have coming up. My work: {portfolio}

If it isn't the right time, no problem at all — just let me know and I'll check back later in the year.

Thanks,
{me}
{signature}`,
  hooks: {
    "Pickleball": "I play regularly, so I can shoot {brand} gear in real games and real conditions rather than a studio setup — paddle sound, footwork, the actual look on court.",
    "Fashion & Apparel": "I'd focus on real styling and fit content for {brand} — how the pieces actually move and wear across a normal week.",
    "Supplements & Wellness": "I'd show {brand} as part of an honest daily routine, which tends to land better than anything that looks staged.",
    "Food & Beverage": "I'd shoot {brand} the way people actually eat and drink it — quick, appetising, and genuinely unfussy.",
    "Beauty & Skincare": "I'd do honest application and routine content for {brand}, including the unglamorous before shots that make the after believable.",
    "Home & Kitchen": "I'd show {brand} in an actual lived-in home rather than a styled set — the version people recognise.",
    "Outdoor & Gear": "I'd take {brand} out and use it properly, so the footage shows real conditions instead of a product table.",
    "Travel": "I'd capture {brand} in transit — packing, airports, the moments people are actually deciding what to buy.",
    "Pet": "I'd shoot {brand} with real animals being real animals, which is usually where the charm is.",
    "DTC & Lifestyle": "I'd make content that shows {brand} fitting into an ordinary day, in a way that feels recommended rather than advertised.",
    "UK & Europe": "I'd create content that suits {brand}'s tone rather than the louder US style of creator content.",
    "Apps & Tech": "I'd show {brand} solving an actual problem on screen — short, clear, and genuinely useful to watch."
  },

  // Sits above the ideas in the email. Vanishes entirely if there are no ideas.
  ideasLead: "Three ideas I'd love to run past you:",

  // Starting points only — the pitch works because the ideas are specific, so
  // these are meant to be rewritten per brand, and the app says so.
  ideaScaffolds: {
    "Pickleball":
`1. A "first hit" clip — unboxing the paddle and playing the opening three points with it.
2. A control-vs-power rally shot in real match light, not a studio.
3. A what's-in-my-bag for rec players, with {brand} as the centrepiece.`,
    "Fashion & Apparel":
`1. A one-week wear test — the same piece styled five ways across a normal week.
2. A fit-and-fabric close-up for the product page: no music, just movement.
3. A getting-dressed POV that lands on the {brand} piece as the anchor.`,
    "Supplements & Wellness":
`1. A 7-day routine diary showing where {brand} actually fits in a morning.
2. An honest "first two weeks" check-in, filmed unscripted.
3. A label-read explainer walking through what's actually in it.`,
    "Food & Beverage":
`1. A 15-second pour-and-taste built for paid social.
2. "Three ways I actually use this", filmed in one kitchen session.
3. A fridge-restock reel with {brand} sitting where it really lives.`,
    "Beauty & Skincare":
`1. A no-filter application close-up in morning light, zero retouching.
2. A four-week diary that keeps the unflattering first shot in.
3. An ingredient-list explainer that treats the viewer as smart.`,
    "Home & Kitchen":
`1. A real-use clip in a lived-in kitchen rather than a styled set.
2. A quiet, ASMR-ish shot of {brand} doing its one job well.
3. A "why I replaced my old one" story that ends on {brand}.`,
    "Outdoor & Gear":
`1. A field test in genuinely bad weather, shot handheld.
2. A pack-and-go sequence showing how {brand} actually carries.
3. A durability check after a month of real use, honestly reported.`,
    "Travel":
`1. A packing sequence built around {brand}, filmed in one take.
2. An airport-to-hotel POV showing it in motion.
3. A "what I'd change" review after one full trip.`,
    "Pet":
`1. A genuine first-reaction clip — my dog meeting {brand} for the first time.
2. A week-of-use routine showing where it fits in daily care.
3. An un-staged messy moment, which is usually the one that performs.`,
    "DTC & Lifestyle":
`1. A day-in-the-life where {brand} turns up naturally instead of being announced.
2. A 20-second problem/solution cut for paid social.
3. An honest 30-day check-in on whether I still reach for it.`,
    "UK & Europe":
`1. A restrained, low-key product film that suits {brand}'s tone.
2. A real-use clip in natural light with no hard sell.
3. A short honest review that trusts the viewer to decide.`,
    "Apps & Tech":
`1. A screen-recorded walkthrough solving one real problem in under 30 seconds.
2. "How I actually use this every day" — no feature list.
3. A before-and-after of my workflow with {brand} in it.`
  }
};

/* ============================================================
   STATE
   ============================================================ */
let state = {items:{}, settings:{...DEFAULT_SETTINGS}, templates:structuredClone(DEFAULT_TEMPLATES), custom:{}};
let store = null;   // set once we know local vs cloud

// Reading must never create a record — otherwise a single render
// would write all 294 rows to the database.
// Guards Settings/Templates against a save fired before the account's first
// Firebase snapshot arrives — such a save would overwrite the account with
// blanks. Local builds have their data synchronously, so they start true.
let firstSyncDone = !CLOUD;

const rec  = id => state.items[id] || DEFAULT_ITEM;
const edit = id => (state.items[id] ||= {...DEFAULT_ITEM});
// Checks EVERY field a record can carry. Missing one is destructive: CloudStore
// treats "default" records as deletable, so an unchecked field (ideas, once) was
// silently erased by the very save that should have kept it.
const isDefault = r => r.status === "New" && !r.pitched && !r.notes
                    && !(r.ideas || "").trim() && !r.variant
                    && !(r.email || "").trim();

const settings  = () => ({...DEFAULT_SETTINGS, ...state.settings});

function templates(){
  const saved = state.templates || {};
  const t = {...DEFAULT_TEMPLATES, ...saved};
  t.hooks = {...DEFAULT_TEMPLATES.hooks, ...(saved.hooks || {})};
  t.ideaScaffolds = {...DEFAULT_TEMPLATES.ideaScaffolds, ...(saved.ideaScaffolds || {})};
  // Older saves held one flat template rather than a variant list. Test what
  // was SAVED, not the merged object — the spread above always supplies
  // DEFAULT_TEMPLATES.variants, so checking t.variants would silently throw
  // away her customised wording.
  if (!Array.isArray(saved.variants) || !saved.variants.length){
    t.variants = saved.subjectPitch
      ? [{id:"A", name:"A — yours", subjectPitch:saved.subjectPitch,
          bodyNamed:saved.bodyNamed, bodyGeneric:saved.bodyGeneric}]
      : structuredClone(DEFAULT_VARIANTS);
  }
  return t;
}
const variantById = id => templates().variants.find(v => v.id === id) || templates().variants[0];

const allContacts = () => CONTACTS.concat(Object.values(state.custom || {}));

function isDue(c){
  const r = rec(c.id);
  if (r.status !== "Pitched" && r.status !== "Followed Up") return false;
  const n = daysSince(r.pitched);
  return n !== null && n >= FOLLOWUP_DAYS;
}

/* ============================================================
   STORAGE — local browser, or Firebase when configured
   ============================================================ */
function LocalStore(){
  return {
    async start(onData){
      try { Object.assign(state, JSON.parse(localStorage.getItem(LKEY)) || {}); } catch(e){}
      onData();
    },
    flush(){ localStorage.setItem(LKEY, JSON.stringify(state)); },
    saveItem(){ this.flush(); },
    saveBranch(){ this.flush(); },
    signOut(){}
  };
}

async function CloudStore(fb, uid){
  const {ref, update, set, onValue, remove} = fb.db;
  const base = "users/" + uid;
  let unsub = null;
  return {
    async start(onData){
      // ONE listener. No polling anywhere in this app — a polling loop
      // in an earlier project quietly ran up a large bandwidth bill.
      unsub = onValue(ref(fb.database, base), snap => {
        const v = snap.val() || {};
        state.items    = v.items    || {};
        state.custom   = v.custom   || {};
        state.settings = v.settings || {...DEFAULT_SETTINGS};
        state.templates= v.templates|| structuredClone(DEFAULT_TEMPLATES);
        onData();
      }, err => toastMsg("Sync error: " + err.message));
    },
    flush(){},
    async saveItem(id){
      const r = state.items[id];
      if (!r || isDefault(r)) { delete state.items[id]; await remove(ref(fb.database, `${base}/items/${id}`)); return; }
      await set(ref(fb.database, `${base}/items/${id}`), r);
    },
    async saveBranch(branch){ await set(ref(fb.database, `${base}/${branch}`), state[branch] || null); },
    signOut(){ if (unsub) unsub(); }
  };
}

/* ============================================================
   TEMPLATE MERGE
   ============================================================ */
function firstName(c){
  if (!c.person) return "there";
  return c.person.split(" ")[0];
}
// The three-ideas opener only works because the ideas are specific, so the
// scaffold is a starting point the app nags her to replace — see ideasAreStock.
const scaffoldFor = c => (templates().ideaScaffolds[c.cat] || "").replace(/\{brand\}/g, c.brand);
const ideasFor    = c => (rec(c.id).ideas || "").trim() || scaffoldFor(c);
// A per-record email override beats the imported address — the imported list is
// read-only in the database, so corrections live on the user's own record.
const emailFor    = c => (rec(c.id).email || "").trim() || c.email;
const ideasAreStock = (c, text) => (text ?? ideasFor(c)).trim() === scaffoldFor(c).trim();

function merge(tpl, c, ideasText){
  const s = templates(), st = settings();
  const ideas = (ideasText ?? ideasFor(c)).trim();
  const map = {
    "{brand}": c.brand,
    "{name}": firstName(c),
    "{category}": c.cat,
    "{site}": c.site || "",
    "{me}": st.name || "[your name — set this in Settings]",
    "{portfolio}": st.portfolio || "[portfolio link — set this in Settings]",
    "{ratecard}": st.ratecard || "",
    "{signature}": st.signature || "",
    "{hook}": (s.hooks[c.cat] || "").replace(/\{brand\}/g, c.brand),
    // Lead-in travels with the ideas so an empty box leaves no orphan line.
    "{ideas}": ideas ? ((s.ideasLead || "").trim() + "\n" + ideas) : "",
    // Portfolio video links from the creator profile, one per line.
    "{videos}": [st.video1, st.video2].map(v => (v || "").trim()).filter(Boolean).join("\n")
  };
  return String(tpl).replace(/\{brand\}|\{name\}|\{category\}|\{site\}|\{me\}|\{portfolio\}|\{ratecard\}|\{signature\}|\{hook\}|\{ideas\}|\{videos\}/g,
                             m => map[m] ?? m);
}
// Balance variants *within a category*. Random assignment would let one variant
// drift toward beauty brands and the other toward pet brands, and that confound
// would corrupt the comparison faster than the sample size does.
// `pending` counts variants already assigned earlier in the same batch but not
// yet sent. Without it a bulk run composes every email before any is recorded,
// so every one sees a zero tally and picks the same variant.
function pickVariant(c, pending){
  const vs = templates().variants;
  const counts = vs.map(v =>
    allContacts().filter(x => x.cat === c.cat && rec(x.id).variant === v.id).length
    + (pending?.[c.cat]?.[v.id] || 0));
  return vs[counts.indexOf(Math.min(...counts))];
}

function composeFor(c, followUp, variantId, ideasText){
  const t = templates();
  if (followUp){
    return {variant: null,
            subject: merge(t.subjectFollow, c, ideasText),
            body: merge(t.bodyFollow, c, ideasText).replace(/\n{3,}/g, "\n\n")};
  }
  const v = variantId ? variantById(variantId) : pickVariant(c);
  const bodyTpl = c.kind === "named" ? v.bodyNamed : v.bodyGeneric;
  return {variant: v.id,
          subject: merge(v.subjectPitch, c, ideasText),
          body: merge(bodyTpl, c, ideasText).replace(/\n{3,}/g, "\n\n")};
}
// Catches template placeholders that never got filled in — either square-bracket
// ones from a template written elsewhere ([Brand], [your portfolio link]), or a
// leftover {curly} field the merge didn't recognise, or our own
// "[set this in Settings]" fallbacks. An email that goes out with these in it is
// the clearest possible signal to a spam filter that it's an unfinished blast.
const UNFILLED = /\[[^\]\n]{2,60}\]|\{[A-Za-z_][A-Za-z_ ]{1,28}\}/g;
const unfilledIn = (...parts) => {
  const found = new Set();
  parts.filter(Boolean).forEach(p => (String(p).match(UNFILLED) || []).forEach(x => found.add(x)));
  return [...found].slice(0, 6);
};

const mailtoLink = (c, m) =>

const gmailLink = (c, m) => {

/* ============================================================
   GMAIL SENDING
   ============================================================ */
let gmailToken = null;      // access token, held in memory for this session only
let gmailTokenClient = null;

function loadGis(){
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = ok;
    s.onerror = () => fail(new Error("Couldn't load Google sign-in."));
    document.head.appendChild(s);
  });
}

// No refresh token is stored anywhere — she consents per session and the token
// lives in memory. That's what keeps this out of Google's app-verification path.
async function gmailAuthorize(force){
  if (gmailToken && !force) return gmailToken;
  await loadGis();
  return new Promise((ok, fail) => {
    gmailTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId(),
      scope: GMAIL_SCOPE,
      callback: resp => {
        if (resp.error) return fail(new Error("Gmail access was declined."));
        gmailToken = resp.access_token;
        ok(gmailToken);
      },
      error_callback: () => fail(new Error("Gmail sign-in was closed before finishing.")),
    });
    gmailTokenClient.requestAccessToken({prompt: gmailToken ? "" : "consent"});
  });
}

const b64url = bytes => {
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
// Non-ASCII in a header must be an RFC 2047 encoded-word or Gmail mangles it.
const encHeader = s =>
  /^[\x20-\x7E]*$/.test(s) ? s : "=?UTF-8?B?" + b64url(new TextEncoder().encode(s)).replace(/-/g,"+").replace(/_/g,"/") + "?=";

function buildRaw(to, subject, body){
  const mime =
    `To: ${to}\r\n` +
    `Subject: ${encHeader(subject)}\r\n` +
    `MIME-Version: 1.0\r\n` +
    `Content-Type: text/plain; charset="UTF-8"\r\n` +
    `Content-Transfer-Encoding: 8bit\r\n\r\n` +
    body.replace(/\r?\n/g, "\r\n");
  return b64url(new TextEncoder().encode(mime));
}

async function gmailSend(to, subject, body){
  const send = async token => fetch(
    "https://gmail.googleapis.com/gmail/v1/users/me/messages/send",
    {method: "POST",
     headers: {"authorization": "Bearer " + token, "content-type": "application/json"},
     body: JSON.stringify({raw: buildRaw(to, subject, body)})});

  let res = await send(await gmailAuthorize());
  if (res.status === 401){                       // token aged out mid-run
    res = await send(await gmailAuthorize(true));
  }
  if (!res.ok){
    let detail = "";
    try { detail = (await res.json()).error?.message || ""; } catch(e){}
    const err = new Error(detail || ("Gmail returned " + res.status));
    // 429/403 usually means a sending limit — stop the whole run, don't grind on.
    err.fatal = res.status === 429 || res.status === 403;
    throw err;
  }
  return true;
}

const SUGGEST_ERRORS = {
  site_unreadable: "Their site blocked the request or had nothing readable — write your own ideas for this one.",
  generation_failed: "Couldn't draft ideas just now. Try again in a moment.",
  unauthenticated: "Your login expired. Refresh the page and sign in again.",
};

// The prompt she pastes into HER Claude (claude.ai) — it knows her from her
// own conversations; its answer comes back here and is parsed into the fields.
const PROFILE_PROMPT =
`Write out my creator profile for a brand-outreach tool, using what you know about me:

1. Who I am — 2 or 3 sentences.
2. Things I love and know deeply (sports, hobbies, niches).
3. My audience — who follows me and relates to my content.
4. How my writing sounds — and quote 2 or 3 real captions or messages I've actually written, word for word.
5. My best 1 or 2 videos — the link, plus one sentence on what happens in each and why it worked.

Plain text, clearly numbered, no tables.`;

// The creator profile from Settings, as the payload the Worker's prompts use.
// Returns null when every field is blank so prompts stay unchanged until
// Amanda fills it in.
function creatorProfile(){
  const s = settings(), t = x => (x || "").trim();
  const p = {};
  if (t(s.about))       p.about = t(s.about);
  if (t(s.favorites))   p.favorites = t(s.favorites);
  if (t(s.audience))    p.audience = t(s.audience);
  if (t(s.voiceSample)) p.voice_sample = t(s.voiceSample);
  if (t(s.styleNotes))  p.style_notes = t(s.styleNotes);
  const videos = [[s.video1, s.video1Desc], [s.video2, s.video2Desc]]
    .filter(([u]) => t(u)).map(([u, d]) => ({url: t(u), what: t(d)}));
  if (videos.length) p.videos = videos;
  return Object.keys(p).length ? p : null;
}

async function suggestFromSite(c){
  const token = await getIdToken();
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: {"content-type": "application/json", "authorization": "Bearer " + token},
    body: JSON.stringify({brand: c.brand, category: c.cat, url: c.site,
                          creator: creatorProfile() || undefined}),
  });
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (data.error) throw new Error(SUGGEST_ERRORS[data.error] || ("Couldn't draft ideas: " + data.error));
  if (!res.ok)    throw new Error("Couldn't reach the idea service (" + res.status + ").");
  if (!Array.isArray(data.ideas) || !data.ideas.length) throw new Error("No ideas came back.");
  return data.ideas.map((s, i) => `${i + 1}. ${String(s).replace(/^\d+[.)]\s*/, "").trim()}`);
}

// Parse the answer her Claude gave into profile fields. Returns any subset of
// {about, favorites, audience, style_notes, voice_sample, videos:[{url,what}]}.
async function parseProfileText(text){
  const token = await getIdToken();
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: {"content-type": "application/json", "authorization": "Bearer " + token},
    body: JSON.stringify({kind: "profile_parse", text}),
  });
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (data.error) throw new Error(SUGGEST_ERRORS[data.error] || ("Couldn't read that: " + data.error));
  if (!res.ok) throw new Error("Couldn't reach the service (" + res.status + ").");
  return data;
}

// Phase 2: ask the Worker to write template wording in her voice. Returns
// {subjectPitch, bodyNamed, bodyGeneric, subjectFollow, bodyFollow} with
// {curly} merge fields intact — validated on both ends before it's usable.
async function draftTemplatesFromProfile(){
  const token = await getIdToken();
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: {"content-type": "application/json", "authorization": "Bearer " + token},
    body: JSON.stringify({kind: "templates", creator: creatorProfile()}),
  });
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (data.error === "no_profile")
    throw new Error("Fill in the About-the-creator section in Settings first — the drafts are built from it.");
  if (data.error) throw new Error(SUGGEST_ERRORS[data.error] || ("Couldn't draft templates: " + data.error));
  if (!res.ok)    throw new Error("Couldn't reach the drafting service (" + res.status + ").");
  // Belt and braces on top of the Worker's own checks: pitch bodies must carry
  // {ideas}, and nothing may contain [square] placeholders the merge ignores.
  for (const k of ["subjectPitch", "bodyNamed", "bodyGeneric", "subjectFollow", "bodyFollow"])
    if (typeof data[k] !== "string" || !data[k].trim()) throw new Error("The draft came back incomplete — try again.");
  if (!data.bodyNamed.includes("{ideas}") || !data.bodyGeneric.includes("{ideas}"))
    throw new Error("The draft was missing the {ideas} field — try again.");
  if (/\[[^\]\n]{2,}\]/.test(data.bodyNamed + data.bodyGeneric + data.bodyFollow))
    throw new Error("The draft contained [bracket] placeholders — try again.");
  return data;
}

const filters = {q:"", status:"", kind:"", cat:"", due:false, noIdeas:false, fresh:false};
// "Needs ideas" means not-yet-pitched and nothing written — the prep queue.
const needsIdeas = c => !(rec(c.id).ideas || "").trim() && rec(c.id).status === "New";

function visible(){
  const q = filters.q.trim().toLowerCase();
  return allContacts().filter(c => {
    const r = rec(c.id);
    if (filters.status && r.status !== filters.status) return false;
    if (filters.kind   && c.kind   !== filters.kind)   return false;
    if (filters.cat    && c.cat    !== filters.cat)    return false;
    if (filters.due    && !isDue(c)) return false;
    if (filters.noIdeas && !needsIdeas(c)) return false;
    if (filters.fresh  && r.status !== "New") return false;
    if (q && !(c.brand+" "+(c.person||"")+" "+c.email+" "+emailFor(c)+" "+(c.site||"")).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderStats(){
  const all = allContacts();
  const n = s => all.filter(c => rec(c.id).status === s).length;
  const contacted = all.length - n("New");
  const replied   = n("Replied") + n("Negotiating") + n("Collab!");
  const due       = all.filter(isDue).length;
  const cells = [
    ["Total brands", all.length, ""],
    ["Not pitched",  n("New"), ""],
    ["Pitched",      contacted, ""],
    ["Replied",      replied, "hl"],
    ["Collabs",      n("Collab!"), "hl"],
    ["Reply rate",   (contacted ? Math.round(replied/contacted*100) : 0) + "%", ""],
    ["Follow up now", due, due ? "hl" : ""],
  ];
  $("stats").innerHTML = cells.map(([l,v,cls]) =>
    `<div class="stat ${cls}"><b>${v}</b><span>${l}</span></div>`).join("");
}

function renderList(){
  const rows = visible();
  $("count").textContent = rows.length + " of " + allContacts().length + " brands";

  if (!rows.length){ $("list").innerHTML = '<div class="empty">Nothing matches those filters.</div>'; return; }

  $("list").innerHTML = rows.map(c => {
    const r = rec(c.id), due = isDue(c), n = daysSince(r.pitched);
    const tags = [`<span class="tag">${esc(c.cat)}</span>`];
    if (c.kind === "generic")  tags.push('<span class="tag generic">generic inbox</span>');
    if (c.kind === "personal") tags.push('<span class="tag personal">personal email</span>');
    if (c.dupBrand)            tags.push('<span class="tag dup">2 contacts here</span>');
    if (c.mine)                tags.push('<span class="tag mine">added by you</span>');
    if (c.suggested)           tags.push('<span class="tag mine">researched ideas</span>');
    if (c.deal)                tags.push(`<span class="tag">${esc(c.deal)}</span>`);
    if (due)                   tags.push(`<span class="tag duealert">follow up · ${n}d</span>`);

    return `
    <div class="card ${due?"due":""}" data-id="${c.id}">
      <div class="head js-open">
        ${CAN_SEND() ? `<input type="checkbox" class="js-pick" ${selected.has(String(c.id)) ? "checked" : ""}
           title="Select for bulk send" style="width:17px;height:17px;flex:none;margin-top:2px">` : ""}
        <div class="who">
          <div class="brand">${esc(c.brand)}</div>
          <div class="sub">${esc(c.person || emailFor(c))}</div>
          <div class="tags">${tags.join("")}</div>
        </div>
      </div>
      <div class="cardfoot">
        <select class="status js-status" data-s="${r.status}" title="Status">
          ${STATUSES.map(s => `<option ${s===r.status?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>
    </div>`;
  }).join("");
}

/* ============================================================
   A/B RESULTS
   ============================================================ */
const REPLIED_STATES = ["Replied","Negotiating","Collab!"];

function abStats(){
  const all = allContacts();
  return templates().variants.map(v => {
    const rows = all.filter(c => rec(c.id).variant === v.id);
    const sends   = rows.length;
    const replies = rows.filter(c => REPLIED_STATES.includes(rec(c.id).status)).length;
    const collabs = rows.filter(c => rec(c.id).status === "Collab!").length;
    return {id:v.id, name:v.name, sends, replies, collabs,
            collabRate: sends ? collabs/sends : 0,
            replyRate:  sends ? replies/sends : 0};
  });
}

// Two-proportion z-test. Used only to decide whether we're allowed to call a
// winner at all — never to dress a small sample up as a result.
function zTest(a, b, key){
  const na = a.sends, nb = b.sends;
  if (!na || !nb) return null;
  const xa = key === "collabs" ? a.collabs : a.replies;
  const xb = key === "collabs" ? b.collabs : b.replies;
  const p = (xa + xb) / (na + nb);
  const se = Math.sqrt(p * (1 - p) * (1/na + 1/nb));
  if (!se) return null;
  const z = Math.abs((xa/na - xb/nb) / se);
  // p < 0.05 two-tailed
  return {z, significant: z > 1.96};
}

function openAB(){
  const stats = abStats();
  const total = stats.reduce((n,s) => n + s.sends, 0);
  const pct = n => (n * 100).toFixed(1) + "%";

  const rows = stats.map(s => `
    <tr>
      <td style="padding:6px 10px 6px 0"><b>${esc(s.name)}</b></td>
      <td style="padding:6px 10px;text-align:right">${s.sends}</td>
      <td style="padding:6px 10px;text-align:right"><b>${s.collabs}</b> · ${pct(s.collabRate)}</td>
      <td style="padding:6px 0 6px 10px;text-align:right;color:var(--muted)">${s.replies} · ${pct(s.replyRate)}</td>
    </tr>`).join("");

  let verdict;
  if (total < AB_MIN_SENDS){
    verdict = `<p class="hint" style="font-size:13px">
      <b>Locked until ${AB_MIN_SENDS} sends — ${total} so far.</b>
      Below that, one or two collabs landing either way swings the rate enough to look
      like a winner when it's chance. Keep sending; this unlocks on its own.</p>`;
  } else {
    const sorted = [...stats].sort((a,b) => b.collabRate - a.collabRate);
    const [top, next] = sorted;
    const t = zTest(top, next, "collabs");
    if (t?.significant){
      verdict = `<p class="hint" style="font-size:13px;color:var(--ok)">
        <b>${esc(top.name)} is genuinely ahead on collabs</b> (${pct(top.collabRate)} vs ${pct(next.collabRate)}).
        That gap is larger than chance would explain. Worth making it the default.</p>`;
    } else {
      const r = zTest(top, next, "replies");
      verdict = `<p class="hint" style="font-size:13px">
        <b>No clear winner on collabs yet.</b> ${esc(top.name)} leads ${pct(top.collabRate)} to
        ${pct(next.collabRate)}, but at these counts that's within what chance produces —
        it isn't evidence.
        ${r?.significant
          ? ` On replies, though, ${esc([...stats].sort((a,b) => b.replyRate - a.replyRate)[0].name)} is genuinely ahead — an early tell worth watching.`
          : ` Reply rates haven't separated either.`}</p>`;
    }
  }

  const m = modal(`
    <h2>A/B results</h2>
    <p class="hint">Collabs is the headline. Reply rate is shown alongside because it moves sooner.</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px">
      <tr style="border-bottom:1px solid var(--line)">
        <th style="text-align:left;padding-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Variant</th>
        <th style="text-align:right;padding-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Sent</th>
        <th style="text-align:right;padding-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Collabs</th>
        <th style="text-align:right;padding-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Replies</th>
      </tr>
      ${rows}
    </table>
    ${verdict}
    <div class="row"><button class="btn" id="abClose">Close</button>
      <button class="btn" id="abTpl">Edit templates</button></div>`);
  m.querySelector("#abClose").onclick = closeModal;
  m.querySelector("#abTpl").onclick = () => { closeModal(); openTemplates(); };

/* ============================================================
   BULK SEND
   ============================================================ */
const selected = new Set();   // session-only; never persisted
const sentToday = () => allContacts().filter(c => rec(c.id).pitched === today()).length;

// Every reason a brand must not be auto-sent. The stock-ideas rule is the
// important one: at bulk speed she'd never notice 20 emails each claiming
// "I had three ideas for you" while carrying identical template text.
function blockReason(c, capLeft){
  const r = rec(c.id);
  if (r.status === "Bounced")                 return "address bounced before";
  if (r.status !== "New")                     return "already " + r.status.toLowerCase();
  if (isDue(c))                               return "needs a follow-up, not a first pitch";
  if (ideasAreStock(c, r.ideas))              return "ideas are still the stock " + c.cat + " starters";
  if (!(r.ideas || "").trim())                return "no ideas written";
  if (capLeft <= 0)                           return "over today's cap";
  return null;
}

function openBulkSend(){
  const st = settings();
  const picked = allContacts().filter(c => selected.has(String(c.id)));
  if (!picked.length) return toastMsg("Nothing selected");

  const missing = [];
  if (!st.name)      missing.push("your name");
  if (!st.portfolio) missing.push("your portfolio link");

  let capLeft = Math.max(0, (st.dailyCap || 15) - sentToday());
  const ready = [], blocked = [], pending = {};
  for (const c of picked){
    const why = blockReason(c, capLeft);
    if (why) { blocked.push({c, why}); continue; }
    capLeft--;
    // Assign the variant against the batch-aware tally, then book it so the
    // next brand in the same category sees it.
    const v = pickVariant(c, pending);
    const built = composeFor(c, false, v.id);
    // Last gate: never send an email that still has [Brand] or {field} in it.
    const bad = unfilledIn(built.subject, built.body);
    if (bad.length){
      blocked.push({c, why: "unfilled placeholder " + bad[0]});
      capLeft++;                       // didn't actually use a slot
      continue;
    }
    (pending[c.cat] ||= {})[v.id] = (pending[c.cat]?.[v.id] || 0) + 1;
    ready.push({c, ...built});
  }

  const row = (name, right) =>
    `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px">
       <span style="flex:1;min-width:0">${esc(name)}</span>
       <span style="color:var(--muted);white-space:nowrap">${right}</span></div>`;

  const m = modal(`
    <h2>Send ${ready.length} email${ready.length === 1 ? "" : "s"}</h2>
    <p class="hint">Sent from your Gmail, one at a time with a pause between each.
       ${sentToday()} already sent today · cap ${st.dailyCap || 15}.</p>
    ${missing.length ? `<p class="hint" style="color:var(--warn)">
       <b>Set ${esc(missing.join(" and "))} in Settings first</b> — every email would go out with a placeholder.</p>` : ""}
    ${ready.length ? `<div class="field"><label>Will send</label>
      <div style="max-height:190px;overflow:auto">${
        ready.map(r => row(r.c.brand, esc(emailFor(r.c)))).join("")}</div></div>` : ""}
    ${blocked.length ? `<div class="field"><label>Skipped (${blocked.length})</label>
      <div style="max-height:150px;overflow:auto">${
        blocked.map(b => row(b.c.brand, `<span style="color:var(--warn)">${esc(b.why)}</span>`)).join("")}</div></div>` : ""}
    <div id="bsProgress"></div>
    <div class="row">
      <button class="btn primary" id="bsGo" ${(!ready.length || missing.length) ? "disabled" : ""}>
        Send ${ready.length}</button>
      <button class="btn" id="bsStop" style="display:none">Stop</button>
      <span class="spacer"></span>
      <button class="btn" id="bsClose">Close</button>
    </div>`);

  m.querySelector("#bsClose").onclick = closeModal;
  m.querySelector("#bsGo").onclick = () => runBulkSend(m, ready);
}

async function runBulkSend(m, ready){
  const go = m.querySelector("#bsGo"), stopBtn = m.querySelector("#bsStop");
  const prog = m.querySelector("#bsProgress");
  let stopped = false;
  stopBtn.onclick = () => { stopped = true; stopBtn.textContent = "Stopping…"; };

  go.disabled = true; go.textContent = "Sending…"; stopBtn.style.display = "";
  prog.innerHTML = `<div class="field"><label>Progress</label><div id="bsRows"></div></div>`;
  const rows = m.querySelector("#bsRows");
  const line = (name, state, cls) =>
    `<div style="display:flex;gap:10px;padding:4px 0;font-size:13.5px">
       <span style="flex:1">${esc(name)}</span>
       <span style="color:var(--${cls})">${esc(state)}</span></div>`;

  try {
    await gmailAuthorize();          // one consent for the whole run
  } catch (err) {
    prog.innerHTML = `<p class="hint" style="color:var(--warn)">${esc(err.message)}</p>`;
    go.disabled = false; go.textContent = "Try again"; stopBtn.style.display = "none";
    return;
  }

  const gap = Math.max(0, (settings().sendGapSec ?? 12)) * 1000;
  let ok = 0, failed = 0;

  for (let i = 0; i < ready.length; i++){
    if (stopped){ rows.insertAdjacentHTML("beforeend", line("— stopped —", "", "muted")); break; }
    const {c, subject, body, variant} = ready[i];
    rows.insertAdjacentHTML("beforeend", line(c.brand, "sending…", "muted"));
    const el = rows.lastElementChild;

    try {
      await gmailSend(emailFor(c), subject, body);
      const r = edit(c.id);
      r.status = "Pitched";
      r.pitched = today();
      if (variant && !r.variant) r.variant = variant;
      // Keep what actually went out, so the follow-up can refer back to it.
      r.notes = (r.notes ? r.notes + "\n\n" : "") + `[sent ${today()}] ${subject}\n${body}`;
      store.saveItem(c.id); store.flush();
      el.outerHTML = line(c.brand, "sent ✓", "ok");
      ok++;
      selected.delete(String(c.id));
    } catch (err) {
      el.outerHTML = line(c.brand, err.message.slice(0, 60), "warn");
      failed++;
      if (err.fatal){
        rows.insertAdjacentHTML("beforeend",
          line("— stopped: Gmail is refusing further sends —", "", "warn"));
        break;
      }
    }

    if (i < ready.length - 1 && !stopped){
      // Jittered so the pattern doesn't look mechanical.
      await new Promise(r => setTimeout(r, gap + Math.random() * gap * 0.5));
    }
  }

  stopBtn.style.display = "none";
  go.textContent = `Done — ${ok} sent${failed ? `, ${failed} failed` : ""}`;
  toastMsg(`${ok} sent${failed ? `, ${failed} failed` : ""}`);
  render();
}

function openBrand(c){
  const r = rec(c.id), due = isDue(c);
  const m = modal(`
    <div class="qbrand">${esc(c.brand)}</div>
    <p class="hint">${esc(c.person || "Generic inbox")} · ${esc(c.cat)}
       ${due ? `· <span style="color:var(--warn)">follow-up due</span>` : ""}</p>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="bdCompose">✉ Compose ${due ? "follow-up" : "pitch"}</button>
      ${c.site ? `<a class="btn" href="https://${esc(c.site)}" target="_blank" rel="noopener">Visit ${esc(c.site)}</a>` : ""}
      <span class="spacer"></span>
      ${c.mine ? `<button class="btn" id="bdDel">Delete brand</button>` : ""}
    </div>
    <div class="row">
      <div class="field"><label>Status</label>
        <select id="bdStatus">${STATUSES.map(s => `<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Date pitched</label>
        <input type="date" id="bdDate" value="${r.pitched}"></div>
    </div>
    <div class="field"><label>Email<span id="bdEmailNote" class="hint" style="display:inline">${
      (r.email || "").trim() ? ` — edited; original was ${esc(c.email)}` : ""}</span><span
      id="bdSavedM" style="color:var(--ok);margin-left:8px"></span></label>
      <input type="email" id="bdEmail" value="${esc((r.email || "").trim() || c.email)}"
        placeholder="${esc(c.email)}"></div>
    <div class="field"><label>Three ideas for them<span id="bdIdeasHint">${
      r.ideas ? "" : " — blank, so compose will offer the category starters"}</span><span
      id="bdSavedI" style="color:var(--ok);margin-left:8px"></span></label>
      <textarea id="bdIdeas" style="min-height:96px" placeholder="1.&#10;2.&#10;3.">${esc(r.ideas || "")}</textarea></div>
    ${(c.suggested || (c.site && CAN_SUGGEST())) ? `<div class="field"><label>Suggested — from ${esc(c.site || "their site")}</label>
      <div class="suggestbox" style="min-height:0" id="bdSugBox">${
        c.suggested ? esc(c.suggested) : `<span style="color:var(--muted)">Nothing yet. Read their site to draft three ideas.</span>`}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn primary ${c.suggested ? "" : "hide"}" id="bdUseSug">Use these</button>
        <button class="btn ${c.suggested ? "" : "hide"}" id="bdAppendSug">Add to mine</button>
        <button class="btn ${(c.site && CAN_SUGGEST()) ? "" : "hide"}" id="bdGenSug">✨ Read their site</button>
      </div></div>` : ""}
    <div class="field"><label>Notes<span
      id="bdSavedN" style="color:var(--ok);margin-left:8px"></span></label>
      <textarea id="bdNotes" style="min-height:110px"
        placeholder="What you pitched, what they said…">${esc(r.notes)}</textarea></div>
    <div class="row"><button class="btn" id="bdClose">Done</button></div>`);

  // Write straight through on change; closeModal re-renders the grid.
  const save = () => { store.saveItem(c.id); store.flush(); };
  m.querySelector("#bdStatus").onchange = e => {
    const rr = edit(c.id); rr.status = e.target.value;
    if (rr.status === "Pitched" || rr.status === "Followed Up") rr.pitched = today();
    m.querySelector("#bdDate").value = rr.pitched;
    save();
  };
  m.querySelector("#bdDate").onchange = e => { edit(c.id).pitched = e.target.value; save(); };

  // Autosave was always here — the "Saved ✓" flash exists so she can see it work.
  let t;
  const flashTimers = {};
  const flash = id => {
    const el = m.querySelector(id); if (!el) return;
    el.textContent = "Saved ✓";
    clearTimeout(flashTimers[id]);
    flashTimers[id] = setTimeout(() => { el.textContent = ""; }, 1600);
  };
  const debounced = (field, el, savedId) => el.addEventListener("input", () => {
    edit(c.id)[field] = el.value;
    clearTimeout(t); t = setTimeout(() => { save(); flash(savedId); }, 600);
  });
  const bdIdeas = m.querySelector("#bdIdeas");
  debounced("ideas", bdIdeas, "#bdSavedI");
  debounced("notes", m.querySelector("#bdNotes"), "#bdSavedN");

  // Email: stored as an override only when it differs from the imported
  // address — clearing the field (or retyping the original) removes the
  // override and falls back to the imported one.
  const bdEmail = m.querySelector("#bdEmail");
  bdEmail.addEventListener("input", () => {
    const v = bdEmail.value.trim();
    edit(c.id).email = (v && v !== c.email) ? v : "";
    m.querySelector("#bdEmailNote").textContent =
      (v && v !== c.email) ? ` — edited; original was ${c.email}` : "";
    clearTimeout(t); t = setTimeout(() => { save(); flash("#bdSavedM"); }, 600);
  });

  // The label hint is computed at open, so keep it honest while she types.
  bdIdeas.addEventListener("input", () => {
    m.querySelector("#bdIdeasHint").textContent =
      bdIdeas.value.trim() ? "" : " — blank, so compose will offer the category starters";
  });

  // Suggested ideas: same rules as the compose modal — never overwrite her
  // words without asking, never invent ideas when the site can't be read.
  const setIdeas = v => {
    bdIdeas.value = v;
    bdIdeas.dispatchEvent(new Event("input", {bubbles: true}));
  };
  m.querySelector("#bdUseSug")?.addEventListener("click", () => {
    const hers = bdIdeas.value.trim();
    if (hers && !ideasAreStock(c, hers) &&
        !confirm("Replace what you've written with the suggested ideas?")) return;
    setIdeas(c.suggested);
  });
  m.querySelector("#bdAppendSug")?.addEventListener("click", () => {
    const hers = bdIdeas.value.trim();
    setIdeas((hers && !ideasAreStock(c, hers)) ? hers + "\n" + c.suggested : c.suggested);
  });
  m.querySelector("#bdGenSug")?.addEventListener("click", async e => {
    const btn = e.target, box = m.querySelector("#bdSugBox");
    btn.disabled = true; btn.textContent = "Reading their site…";
    try {
      const res = await suggestFromSite(c);
      c.suggested = res.join("\n");
      box.textContent = c.suggested;
      m.querySelector("#bdUseSug").classList.remove("hide");
      m.querySelector("#bdAppendSug").classList.remove("hide");
      btn.classList.add("hide");
      // Generated ideas go straight into the editable box — that box is what
      // the email uses — unless she's already written her own.
      if (!bdIdeas.value.trim() || ideasAreStock(c, bdIdeas.value)) setIdeas(c.suggested);
    } catch (err) {
      box.innerHTML = `<span style="color:var(--warn)">${esc(err.message)}</span>`;
      btn.disabled = false; btn.textContent = "Try again";
    }
  });

  m.querySelector("#bdCompose").onclick = () => openCompose([c], 0);
  m.querySelector("#bdClose").onclick = closeModal;
  m.querySelector("#bdDel")?.addEventListener("click", () => {
    if (!confirm("Delete " + c.brand + "?")) return;
    delete state.custom[c.id]; delete state.items[c.id];
    store.saveBranch("custom"); store.saveItem(c.id); store.flush(); closeModal();
  });
}

function openCompose(list, i, forceVariant, ideasSoFar){
  const c = list[i];
  if (!c) { closeModal(); toastMsg("Queue finished"); return; }
  const followUp = isDue(c);
  const vs = templates().variants;
  const ideas0 = ideasSoFar ?? ideasFor(c);
  const m0 = composeFor(c, followUp, forceVariant, ideas0);

  const m = modal(`
    ${list.length > 1 ? `<div class="qbar">Send queue — ${i+1} of ${list.length}</div>` : ""}
    <div class="qbrand">${esc(c.brand)}</div>
    <p class="hint">${esc(c.person || "Generic inbox")} · ${esc(emailFor(c))}${followUp ? " · follow-up" : ""}</p>
    ${(!followUp && vs.length > 1) ? `
      <div class="field"><label>Template variant (A/B)</label>
        <select id="cVar">${vs.map(v =>
          `<option value="${esc(v.id)}" ${v.id === m0.variant ? "selected" : ""}>${esc(v.name)}</option>`
        ).join("")}</select></div>` : ""}
    ${followUp ? "" : `
      <div class="ideawrap">
        <div class="field">
          <label>Your three ideas for ${esc(c.brand)}</label>
          <textarea id="cIdeas" style="min-height:132px">${esc(ideas0)}</textarea>
          <p class="hint" id="cIdeaWarn" style="margin:4px 0 0"></p>
        </div>
        <div class="field">
          <label>Suggested — from ${esc(c.site || "their site")}</label>
          <div class="suggestbox" id="cSugBox">${
            c.suggested ? esc(c.suggested)
                        : `<span style="color:var(--muted)">Nothing yet.${
                            c.site ? " Read their site to draft three ideas." : " No website on file for this brand."}</span>`
          }</div>
          <div class="row" style="margin-top:6px">
            <button class="btn primary ${c.suggested ? "" : "hide"}" id="cUseSug">Use these</button>
            <button class="btn ${c.suggested ? "" : "hide"}" id="cAppendSug">Add to mine</button>
            <button class="btn ${(c.site && CAN_SUGGEST()) ? "" : "hide"}" id="cGenSug">✨ Read their site</button>
          </div>
        </div>
      </div>`}
    <div class="field"><label>Subject</label><input id="cSubj" value="${esc(m0.subject)}"></div>
    <div class="field"><label>Body</label><textarea id="cBody" style="min-height:230px">${esc(m0.body)}</textarea></div>
    <p class="hint" id="cFillWarn" style="margin:-6px 0 10px"></p>
    <div class="row">
      <a class="btn primary" id="cGmail" target="_blank" rel="noopener">Open in Gmail</a>
      <a class="btn" id="cMail">Open in mail app</a>
      <span class="spacer"></span>
      <button class="btn" id="cSent">✓ Sent — next</button>
    </div>
    <div class="row">
      <button class="btn" id="cReplied">They replied</button>
      <button class="btn" id="cSkip">Skip</button>
      <button class="btn" id="cBounced">Bounced</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="cClose">Close</button>
    </div>`);

  const live = () => ({subject: $("cSubj").value, body: $("cBody").value});
  const fillWarn = m.querySelector("#cFillWarn");
  const paintFill = () => {
    const bad = unfilledIn($("cSubj").value, $("cBody").value);
    fillWarn.innerHTML = bad.length
      ? `<b style="color:var(--warn)">Don't send this yet — ${esc(bad.join(", "))}
         ${bad.length === 1 ? "is a placeholder that" : "are placeholders that"} never got filled in.</b>
         Replace them with real words, or use the app's own fields
         (<code>{brand} {name} {me} {portfolio} {ideas}</code>) so they fill automatically.`
      : "";
  };
  const sync = () => {
    m.querySelector("#cGmail").href = gmailLink(c, live());
    m.querySelector("#cMail").href  = mailtoLink(c, live());
    paintFill();
  };
  sync();
  m.querySelector("#cSubj").addEventListener("input", sync);
  m.querySelector("#cBody").addEventListener("input", sync);
  // Switching variant reloads the wording — carry the ideas across.
  m.querySelector("#cVar")?.addEventListener("change",
    e => openCompose(list, i, e.target.value, $("cIdeas")?.value));

  /* ---- ideas ---- */
  const ideasBox = m.querySelector("#cIdeas");
  const warnEl   = m.querySelector("#cIdeaWarn");
  let lastBuiltBody = m0.body;

  const paintWarn = () => {
    if (!warnEl) return;
    if (ideasAreStock(c, ideasBox.value)){
      warnEl.innerHTML = `<b style="color:var(--warn)">These are still the stock ${esc(c.cat)} ideas.</b>
        The opener only lands if the ideas are specific to ${esc(c.brand)} — worth 30 seconds on their site first.`;
    } else if (!ideasBox.value.trim()){
      warnEl.innerHTML = `<span style="color:var(--muted)">No ideas — the email will simply leave that part out.</span>`;
    } else {
      warnEl.innerHTML = `<span style="color:var(--ok)">Specific to ${esc(c.brand)} ✓</span>`;
    }
  };
  paintWarn();

  const ideasChanged = () => {
    paintWarn();
    const rebuilt = composeFor(c, followUp, m0.variant, ideasBox.value);
    // Only refresh the body while she hasn't hand-edited it, or we'd wipe her work.
    if ($("cBody").value === lastBuiltBody){
      $("cBody").value = rebuilt.body;
      lastBuiltBody = rebuilt.body;
      sync();
    }
  };
  ideasBox?.addEventListener("input", ideasChanged);

  // Suggested ideas never overwrite her own words without her asking.
  m.querySelector("#cUseSug")?.addEventListener("click", () => {
    const hers = ideasBox.value.trim();
    if (hers && !ideasAreStock(c, hers) &&
        !confirm("Replace what you've written with the suggested ideas?")) return;
    ideasBox.value = c.suggested; ideasChanged();
  });
  m.querySelector("#cAppendSug")?.addEventListener("click", () => {
    const hers = ideasBox.value.trim();
    ideasBox.value = (hers && !ideasAreStock(c, hers)) ? hers + "\n" + c.suggested : c.suggested;
    ideasChanged();
  });

  // Ask the Worker to read the brand's site and draft ideas.
  m.querySelector("#cGenSug")?.addEventListener("click", async e => {
    const btn = e.target, box = m.querySelector("#cSugBox");
    btn.disabled = true; btn.textContent = "Reading their site…";
    try {
      const res = await suggestFromSite(c);
      c.suggested = res.join("\n");
      box.textContent = c.suggested;
      m.querySelector("#cUseSug").classList.remove("hide");
      m.querySelector("#cAppendSug").classList.remove("hide");
      btn.classList.add("hide");
      // Same auto-apply as the detail view: the email is built from the ideas
      // box, so generated ideas replace an empty or still-stock box directly
      // (ideasChanged refreshes the body unless she's hand-edited it).
      if (!ideasBox.value.trim() || ideasAreStock(c, ideasBox.value)) {
        ideasBox.value = c.suggested;
        ideasChanged();
      }
    } catch (err) {
      // Never invent ideas when the site can't be read — say so and leave the
      // category scaffold in place.
      box.innerHTML = `<span style="color:var(--warn)">${esc(err.message)}</span>`;
      btn.disabled = false; btn.textContent = "Try again";
    }
  });

  const advance = () => openCompose(list, i + 1);
  const setStatus = s => {
    const r = edit(c.id);
    r.status = s;
    if (s === "Pitched" || s === "Followed Up") r.pitched = today();
    // Keep whatever she actually pitched, so follow-ups can refer back to it.
    if (ideasBox && ideasBox.value.trim() && !ideasAreStock(c, ideasBox.value)) r.ideas = ideasBox.value.trim();
    // Stamp the variant on the first pitch only (Sent, Replied or Bounced all
    // mean this wording went out). Follow-ups share one template, so counting
    // them would test two things at once.
    if (!followUp && m0.variant && !r.variant) r.variant = m0.variant;
    store.saveItem(c.id); store.flush();
  };

  m.querySelector("#cSent").onclick    = () => { setStatus(followUp ? "Followed Up" : "Pitched"); advance(); };
  m.querySelector("#cReplied").onclick = () => { setStatus("Replied"); advance(); };
  m.querySelector("#cBounced").onclick = () => { setStatus("Bounced"); advance(); };
  m.querySelector("#cSkip").onclick    = advance;
  m.querySelector("#cClose").onclick   = closeModal;
}

function startQueue(){
  const rows = visible();
  const due  = rows.filter(isDue);
  const fresh= rows.filter(c => rec(c.id).status === "New");
  const list = due.concat(fresh);
  if (!list.length) return toastMsg("Nothing to send in this filter");
  if (!settings().name || !settings().portfolio){
    if (!confirm("Your name or portfolio link isn't set yet, so the emails will have placeholders in them. Open the queue anyway?"))
      return openSettings();
  }
  openCompose(list, 0);
}

/* ---------- backup / export ---------- */
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("expBackup").onclick = () =>
  download("ugc-backup-" + today() + ".json", JSON.stringify(state, null, 1), "application/json");

$("expCsv").onclick = () => {
  const qq = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  const rows = [["Brand","Contact","Email","Website","Category","Contact type","Status","Date pitched","Variant","Ideas","Notes"]]
    .concat(visible().map(c => {
      const r = rec(c.id);
      return [c.brand, c.person, emailFor(c), c.site, c.cat, c.kind, r.status, r.pitched,
              r.variant || "", r.ideas || "", r.notes];
    }));
  download("ugc-outreach-" + today() + ".csv", rows.map(r => r.map(qq).join(",")).join("\n"), "text/csv");
};

$("impBackup").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (typeof data !== "object" || Array.isArray(data)) throw new Error("bad file");
      state.items = data.items || {}; state.custom = data.custom || {};
      state.settings = data.settings || {...DEFAULT_SETTINGS};
      state.templates = data.templates || structuredClone(DEFAULT_TEMPLATES);
      ["items","custom","settings","templates"].forEach(b => store.saveBranch(b));
      store.flush(); render(); toastMsg("Restored");
    } catch(err){ toastMsg("That file didn't look like a backup"); }
    $("file").value = "";
  };
  fr.readAsText(f);
};

$("reset").onclick = () => {
  if (!confirm("Erase every status, date and note? Back up first if you're unsure.")) return;
  state.items = {};
  store.saveBranch("items"); store.flush(); render(); toastMsg("Progress cleared");
};

let toastTimer;
function toastMsg(m){
  const t = $("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
window.toastMsg = toastMsg;

/* ============================================================
   BOOT
   ============================================================ */
function showApp(){
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
  $("tagline").textContent = allContacts().length + " contacts · "
    + (CLOUD ? "synced to your account" : "saved in this browser")
    + " · v" + APP_VERSION;
}

async function bootLocal(){
  store = LocalStore();
  await store.start(() => { showApp(); render(); });
}

async function bootCloud(){
  const V = "https://www.gstatic.com/firebasejs/11.0.2/";
  const [appMod, authMod, dbMod] = await Promise.all([
    import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-database.js")
  ]);
  const app  = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  const database = dbMod.getDatabase(app);
  const fb = {database, db: dbMod};

  await authMod.setPersistence(auth, authMod.browserLocalPersistence);

  $("liGo").onclick = async () => {
    $("liErr").textContent = "";
    try {
      await authMod.signInWithEmailAndPassword(auth, $("liEmail").value.trim(), $("liPass").value);
    } catch(err){
      $("liErr").textContent = /invalid|wrong|not-found/i.test(err.code||"")
        ? "That email and password don't match." : (err.message || "Sign-in failed.");
    }
  };
  $("liPass").addEventListener("keydown", e => { if (e.key === "Enter") $("liGo").click(); });
  $("liReset").onclick = async () => {
    const em = $("liEmail").value.trim();
    if (!em) return $("liErr").textContent = "Type your email first, then tap again.";
    try { await authMod.sendPasswordResetEmail(auth, em); $("liErr").textContent = "Reset link sent — check your inbox."; }
    catch(err){ $("liErr").textContent = err.message; }
  };
  $("btnOut").classList.remove("hide");
  $("btnOut").onclick = () => { store?.signOut(); authMod.signOut(auth); };

  authMod.onAuthStateChanged(auth, async user => {
    // Fresh token per call — getIdToken() refreshes it when near expiry.
    getIdToken = user ? (() => user.getIdToken()) : null;
    if (!user){
      store?.signOut(); store = null;
      $("app").classList.add("hide"); $("login").classList.remove("hide");
      $("liPass").value = "";
      return;
    }
    // Contacts live in the database, not in this file, so the public
    // page never exposes them.
    try {
      const snap = await dbMod.get(dbMod.ref(database, "contacts"));
      // Keys are 1..294, so the SDK hands this back as an ARRAY with a null at
      // index 0, not an object. Drop anything that isn't a real record.
      CONTACTS = Object.values(snap.val() || {}).filter(c => c && c.id && c.email);
    } catch(err){ toastMsg("Couldn't load the brand list: " + err.message); }
    store = await CloudStore(fb, user.uid);
    await store.start(() => { firstSyncDone = true; showApp(); render(); });
  });
}

if (CLOUD) bootCloud().catch(err => {
  $("login").classList.remove("hide");
  $("liErr").textContent = "Couldn't reach the server: " + err.message;
});
else bootLocal();
</script>
</body>
</html>
